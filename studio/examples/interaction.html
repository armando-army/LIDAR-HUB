<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiDAR Studio · Superficie de prueba</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e18;color:#d9e6f1;font:14px system-ui}header{padding:20px;display:flex;gap:24px;align-items:center}a{color:#72e2e7}button{background:#1b3446;color:#c6f5ff;border:1px solid #407080;padding:10px;border-radius:6px}canvas{display:block;width:100vw;height:calc(100vh - 85px)}#state{margin-left:auto;color:#7a9bb0}</style>
<header><a href="../index.html" target="_blank">⌖ Abrir calibrador</a><button id="full">Pantalla completa</button><strong>SUPERFICIE DE PRUEBA</strong><span id="state">Habilitá la salida JSON en el calibrador</span></header><canvas id="wall"></canvas>
<script type="module">
import {LiDARClient,ZoneTriggers} from '../../sdk/lidar-client.mjs';
const client=new LiDARClient(),zones=new ZoneTriggers(),canvas=document.getElementById('wall'),ctx=canvas.getContext('2d'),label=document.getElementById('state');let payload={contacts:[],surface:{width:3,height:2,zoneSize:.25}},waves=[];
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen();
client.addEventListener('contacts',e=>{payload=e.detail;label.textContent=`${payload.simulated?'SIMULACIÓN · ':''}${payload.contacts.length} contactos · ${payload.calibrated?'área calibrada':'sin área'}`;});
function draw(now){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;const W=canvas.width,H=canvas.height,s=payload.surface||{width:3,height:2,zoneSize:.25};const scale=Math.min(W/s.width,H/s.height),w=s.width*scale,h=s.height*scale,x=(W-w)/2,y=(H-h)/2;ctx.fillStyle='#080e18';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(x,y);ctx.strokeStyle='#243848';for(let i=0;i<=s.width+.001;i+=s.zoneSize){ctx.beginPath();ctx.moveTo(i*scale,0);ctx.lineTo(i*scale,h);ctx.stroke();}for(let i=0;i<=s.height+.001;i+=s.zoneSize){ctx.beginPath();ctx.moveTo(0,i*scale);ctx.lineTo(w,i*scale);ctx.stroke();}for(const event of zones.update(payload,now))waves.push({...event,t:now});waves=waves.filter(p=>now-p.t<1500);for(const p of waves){const age=(now-p.t)/1500;ctx.strokeStyle=`rgba(100,230,240,${1-age})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x*w,p.y*h,8+age*150,0,Math.PI*2);ctx.stroke();}for(const p of payload.contacts){ctx.fillStyle='#f4dd80';ctx.beginPath();ctx.arc(p.x*w,p.y*h,12,0,Math.PI*2);ctx.fill();ctx.fillText('#'+p.id,p.x*w+18,p.y*h);}ctx.restore();requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
